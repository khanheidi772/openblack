name: Cross Compile CI
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        triplet:
        - ''
        preset:
        - android-armeabi-v7a-vcpkg
        - android-arm64-v8a-vcpkg
        - android-x86-vcpkg
        - android-x86_64-vcpkg
        os:
        - ubuntu-24.04
        include:
        - triplet: arm64-linux
          os: ubuntu-24.04-arm
          preset: ninja-multi-vcpkg
          setup: |
            sudo apt-get update
            sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libxext-dev libwayland-dev libwayland-egl-backend-dev
        - triplet: x86-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - triplet: arm64-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - os: macos-latest
          preset: ios-arm64-vcpkg
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      EMSDK: /tmp/emsdk/upstream/emscripten
    steps:
    - run: echo "GITHUB_REF_NAME_DASHES=${GITHUB_REF_NAME/\//-}" >> $GITHUB_ENV
      shell: bash
  assemble-android-apk:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG assemble-android-apk start"
        HEAD_REF=${{ toJSON(github.event.pull_request.head.ref) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        BASE_REPO=${{ toJSON(github.event.pull_request.base.repo.full_name) }}
        printf 'GERALT_DBG event=%s\n' "$GITHUB_EVENT_NAME"
        printf 'GERALT_DBG head_ref=%s\n' "$HEAD_REF"
        printf 'GERALT_DBG head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG base_repo=%s\n' "$BASE_REPO"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'
    - run: echo "GITHUB_REF_NAME_DASHES=${GITHUB_REF_NAME/\//-}" >> $GITHUB_ENV
      shell: bash
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        build-root-directory: ./android
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG before Write signing key"
        KEYB64=${{ toJSON(secrets.ANDROID_SIGNING_STORE_KEY_B64) }}
        STORE_PW=${{ toJSON(secrets.ANDROID_SIGNING_STORE_PASSWORD) }}
        STORE_ALIAS=${{ toJSON(secrets.ANDROID_SIGNING_STORE_KEY_ALIAS) }}
        printf 'GERALT_DBG ANDROID_SIGNING_STORE_KEY_B64_len=%s\n' "${#KEYB64}"
        printf 'GERALT_DBG ANDROID_SIGNING_STORE_PASSWORD_len=%s\n' "${#STORE_PW}"
        printf 'GERALT_DBG ANDROID_SIGNING_STORE_KEY_ALIAS_len=%s\n' "${#STORE_ALIAS}"
      continue-on-error: true
    - name: Write signing key
      id: write_key
      uses: timheuer/base64-to-file@v1.2
      with:
        fileName: keystore/signing_keystore.jks
        encodedString: ${{ secrets.ANDROID_SIGNING_STORE_KEY_B64 }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG before release gradle sink"
        KEYPATH=${{ toJSON(steps.write_key.outputs.filePath) }}
        printf 'GERALT_DBG write_key_filePath=%s\n' "$KEYPATH"
        if [ -f android/gradlew ]; then echo "GERALT_DBG android/gradlew present"; head -n 3 android/gradlew || true; else echo "GERALT_DBG android/gradlew absent"; fi
        if [ -n "$KEYPATH" ] && [ -f "$KEYPATH" ]; then echo "GERALT_DBG keystore file present"; ls -l "$KEYPATH" || true; else echo "GERALT_DBG keystore file absent"; fi
      continue-on-error: true
    - name: Build with Gradle (Release)
      run: ./gradlew build --no-daemon assembleRelease -PusePrebuiltNativeLibs
      working-directory: ./android
      env:
        STORE_KEY: ${{ steps.write_key.outputs.filePath }}
        STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        STORE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_STORE_KEY_ALIAS }}
        STORE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    tags:
    - '*'
    branches:
    - master
    - ci-tests/**
